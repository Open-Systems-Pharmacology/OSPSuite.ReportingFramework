# inst/validity.yml
#
# Workbook-level validity configuration for templates in inst/templates.
# Each non-empty header is explicitly listed. Header names are matched exactly
# and case-sensitively against row 1.
#
# validity: list
#   Creates a list validation for the complete column (row 2 to Excel's last row).
#   Configure either values: or valuesFunction:, but not both.
#   Blank entries are allowed; non-list entries produce an information message only.
#
# validity: none
#   Explicitly declares that the column is intentionally not list-validated.
#   Running the update script removes any existing data validation from that column.
#
# Excel list validation itself does not distinguish upper/lower case for manually
# typed values, although this configuration and all header matching do.

workbooks:
  Reports.xlsx:
    sheets:
      Scenarios:
        Scenario: {validity: none}
        LongName: {validity: none}
        ShortName: {validity: none}

      DataGroups:
        Group: {validity: none}
        StudyId: {validity: none}
        StudyArm: {validity: none}
        DisplayName: {validity: none}
        Reference: {validity: none}
        DefaultScenario: {validity: none}
        Shape:
          validity: list
          valuesFunction: shapeValues
          prompt: "Select shape."
      Outputs:
        OutputPathId: {validity: none}
        OutputPath: {validity: none}
        DisplayName: {validity: none}
        DisplayUnit: {validity: none}
        Color: {validity: none}
        Fill: {validity: none}

      ModelParameter:
